name: Build LeviPack

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-28
            ndk;28.2.13676358

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build ARM64 LeviPack
        run: chmod +x scripts/build.sh && ./scripts/build.sh arm64-v8a

      - name: Upload LeviPack artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freecam-Vertical-Controls-levipack
          path: build-arm64-v8a/*.levipack
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-arm64-v8a/*.levipack
