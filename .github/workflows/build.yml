name: Build LeviPack

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Android NDK and Ninja
        run: |
          # Runner ubuntu-latest sudah punya Android SDK (ANDROID_HOME), tidak perlu setup-android.
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Build ARM64 LeviPack
        run: bash scripts/build.sh arm64-v8a
      - name: Upload LeviPack artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freecam-Vertical-Controls-levipack
          path: build-arm64-v8a/*.levipack
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-arm64-v8a/*.levipack
